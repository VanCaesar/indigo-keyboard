name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          mkdir -p build
          xcodebuild build \
            -project Indigo.xcodeproj \
            -scheme Indigo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1 || { grep -E 'error:' build/xcodebuild.log | head -50; tail -80 build/xcodebuild.log; exit 1; }
          grep -E 'warning:' build/xcodebuild.log | sort -u | head -30 || true
          tail -3 build/xcodebuild.log

      - name: Package IPA
        run: ./scripts/package-ipa.sh build/Build/Products/Release-iphoneos/Indigo.app Indigo-unsigned.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: Indigo-unsigned-ipa
          path: Indigo-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
